<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="飲食拍立得">
  <title>AI 飲食營養拍立得</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background-color: #f4f4f6;
      color: #1c1c1e;
      -webkit-tap-highlight-color: transparent;
    }
    .card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }
    .loader {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #10b981;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="pb-12">

  <!-- 頂部導覽列 -->
  <header class="bg-white/80 backdrop-blur-md sticky top-0 z-30 border-b border-gray-100 px-4 py-3.5 flex justify-between items-center max-w-md mx-auto">
    <div class="flex items-center space-x-2">
      <span class="text-2xl">📸</span>
      <h1 class="text-lg font-extrabold tracking-tight text-gray-900">飲食營養拍立得</h1>
    </div>
    <button type="button" onclick="toggleApiModal()" id="apiStatusBtn" class="text-xs font-semibold px-3 py-1.5 rounded-full bg-gray-100 text-gray-600 flex items-center space-x-1">
      <span id="apiDot" class="w-2 h-2 rounded-full bg-gray-400"></span>
      <span>API 設定</span>
    </button>
  </header>

  <main class="max-w-md mx-auto px-4 mt-4 space-y-4">

    <!-- API Key 與模型設定折疊區 -->
    <div id="apiModal" class="card p-4 hidden border-2 border-emerald-500/20 space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-bold text-gray-800">🔑 設定 Gemini API Key</h2>
        <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-xs text-emerald-600 font-semibold underline">免費取得 Key ↗</a>
      </div>
      <p class="text-xs text-gray-500">金鑰僅儲存於您的手機瀏覽器中，不會上傳至任何第三方伺服器。</p>
      
      <div>
        <label class="block text-[11px] font-bold text-gray-600 mb-1">API 金鑰</label>
        <input type="password" id="apiKeyInput" placeholder="貼上 AIzaSy... 開頭的金鑰" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
      </div>

      <div>
        <label class="block text-[11px] font-bold text-gray-600 mb-1">AI 模型版本（若預設無效可隨時切換）</label>
        <input type="text" id="modelInput" value="gemini-3.8-flash" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-emerald-500">
        <div class="flex flex-wrap gap-1.5 mt-1.5">
          <button type="button" onclick="setModelName('gemini-3.8-flash')" class="text-[10px] bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded font-semibold">gemini-3.8-flash</button>
          <button type="button" onclick="setModelName('gemini-3.0-flash')" class="text-[10px] bg-gray-100 text-gray-600 px-2 py-0.5 rounded font-semibold">gemini-3.0-flash</button>
          <button type="button" onclick="setModelName('gemini-flash-latest')" class="text-[10px] bg-gray-100 text-gray-600 px-2 py-0.5 rounded font-semibold">gemini-flash-latest</button>
        </div>
      </div>

      <button type="button" onclick="saveApiKey()" class="w-full bg-gray-900 text-white text-sm font-bold py-2.5 rounded-xl active:scale-95 transition">儲存設定</button>
    </div>

    <!-- 步驟 1：上傳照片與補充資訊 -->
    <section class="card p-5 space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-base font-bold text-gray-900">1. 提供餐點資訊</h2>
        <span class="text-xs text-gray-400 font-medium">原圖不裁切合成</span>
      </div>

      <!-- 雙圖片上傳格 -->
      <div class="grid grid-cols-2 gap-3">
        <!-- 餐點主圖 (必填) -->
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1.5">🍱 餐點實拍照 <span class="text-red-500">*</span></label>
          <label for="foodPhotoInput" class="cursor-pointer flex flex-col items-center justify-center h-32 rounded-2xl border-2 border-dashed border-emerald-300 bg-emerald-50/40 hover:bg-emerald-50 transition relative overflow-hidden group">
            <img id="foodPreview" class="absolute inset-0 w-full h-full object-cover hidden" />
            <div id="foodPlaceholder" class="flex flex-col items-center text-center p-2">
              <span class="text-2xl mb-1">📷</span>
              <span class="text-xs font-bold text-emerald-700">點擊拍照 / 選圖</span>
              <span class="text-[10px] text-emerald-600/70 mt-0.5">作為拍立得底圖</span>
            </div>
          </label>
          <input type="file" id="foodPhotoInput" accept="image/*" class="hidden" onchange="handleImageUpload(event, 'food')">
        </div>

        <!-- 菜單或營養標示 (選填) -->
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1.5">📋 菜單 / 標示照 <span class="text-gray-400 font-normal">(選填)</span></label>
          <label for="menuPhotoInput" class="cursor-pointer flex flex-col items-center justify-center h-32 rounded-2xl border-2 border-dashed border-gray-200 bg-gray-50 hover:bg-gray-100 transition relative overflow-hidden">
            <img id="menuPreview" class="absolute inset-0 w-full h-full object-cover hidden" />
            <div id="menuPlaceholder" class="flex flex-col items-center text-center p-2">
              <span class="text-2xl mb-1">🧾</span>
              <span class="text-xs font-bold text-gray-600">上傳菜單文字</span>
              <span class="text-[10px] text-gray-400 mt-0.5">輔助 AI 精準估算</span>
            </div>
          </label>
          <input type="file" id="menuPhotoInput" accept="image/*" class="hidden" onchange="handleImageUpload(event, 'menu')">
        </div>
      </div>

      <!-- 手打文字補充 -->
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1.5">✍️ 手打補充說明 <span class="text-gray-400 font-normal">(選填)</span></label>
        <textarea id="noteInput" rows="2" placeholder="例如：雞胸肉 150g、飯只吃一半、無糖豆漿 400ml、去皮..." class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 resize-none"></textarea>
      </div>

      <!-- 操作按鈕組 -->
      <div class="pt-1 flex flex-col space-y-2">
        <button type="button" id="analyzeBtn" onclick="analyzeWithAI()" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-bold py-3.5 rounded-xl shadow-md shadow-emerald-600/20 flex items-center justify-center space-x-2 transition">
          <span id="btnText">✨ AI 智能估算並生成拍立得</span>
          <div id="btnLoader" class="loader hidden"></div>
        </button>
        <button type="button" onclick="showManualSection()" class="w-full py-2 text-xs font-semibold text-gray-500 hover:text-gray-800 transition">
          或者：直接手動輸入數字合成圖卡 ↓
        </button>
      </div>
    </section>

    <!-- 步驟 2：AI 營養總結與微調區 -->
    <section id="resultSection" class="card p-5 space-y-4 hidden">
      <div class="flex items-center justify-between border-b border-gray-100 pb-3">
        <h2 class="text-base font-bold text-gray-900">2. 餐點營養總結</h2>
        <button type="button" onclick="copySummaryText()" class="text-xs font-bold bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg transition active:scale-95">
          📋 複製文字紀錄
        </button>
      </div>

      <!-- 四大營養素完整顯示與微調面板 -->
      <div class="grid grid-cols-4 gap-2 text-center">
        <div class="bg-orange-50/80 border border-orange-100 rounded-xl p-2.5">
          <span class="text-[11px] font-bold text-orange-600 block">🔥 熱量</span>
          <input type="number" id="calInput" value="0" oninput="renderPolaroid()" class="w-full bg-transparent text-center font-extrabold text-lg text-gray-900 focus:outline-none border-b border-transparent focus:border-orange-400">
          <span class="text-[10px] text-gray-400 block">kcal</span>
        </div>
        <div class="bg-emerald-50/80 border border-emerald-100 rounded-xl p-2.5">
          <span class="text-[11px] font-bold text-emerald-600 block">💪 蛋白質</span>
          <input type="number" step="0.1" id="proInput" value="0" oninput="renderPolaroid()" class="w-full bg-transparent text-center font-extrabold text-lg text-gray-900 focus:outline-none border-b border-transparent focus:border-emerald-400">
          <span class="text-[10px] text-gray-400 block">g</span>
        </div>
        <div class="bg-amber-50/80 border border-amber-100 rounded-xl p-2.5">
          <span class="text-[11px] font-bold text-amber-700 block">🍚 碳水</span>
          <input type="number" step="0.1" id="carbInput" value="0" class="w-full bg-transparent text-center font-extrabold text-lg text-gray-900 focus:outline-none border-b border-transparent focus:border-amber-400">
          <span class="text-[10px] text-gray-400 block">g</span>
        </div>
        <div class="bg-yellow-50/80 border border-yellow-100 rounded-xl p-2.5">
          <span class="text-[11px] font-bold text-yellow-700 block">🥑 脂肪</span>
          <input type="number" step="0.1" id="fatInput" value="0" class="w-full bg-transparent text-center font-extrabold text-lg text-gray-900 focus:outline-none border-b border-transparent focus:border-yellow-400">
          <span class="text-[10px] text-gray-400 block">g</span>
        </div>
      </div>
      <p class="text-[11px] text-gray-400 text-center">💡 點擊上方數字或下方標題可直接微調，拍立得會即時更新</p>

      <!-- 餐點名稱與文字總結 -->
      <div class="space-y-2.5 pt-1">
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">🏷️ 拍立得顯示餐點標題（可修改）</label>
          <input type="text" id="titleInput" value="健康美味餐點" oninput="renderPolaroid()" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm font-bold text-gray-800 focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">📝 餐點內容與營養結構總結</label>
          <textarea id="summaryInput" rows="3" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-xs leading-relaxed text-gray-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 resize-none"></textarea>
        </div>
      </div>
    </section>

    <!-- 步驟 3：拍立得合成圖卡輸出區 -->
    <section id="polaroidSection" class="card p-5 space-y-4 hidden">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-base font-bold text-gray-900">3. 專屬飲食拍立得</h2>
          <p class="text-xs text-gray-400">長按下方圖片即可「加入照片」存檔</p>
        </div>
        <!-- 主題色切換 -->
        <div class="flex bg-gray-100 p-1 rounded-xl">
          <button type="button" onclick="setTheme('light')" id="themeLightBtn" class="text-xs font-bold px-2.5 py-1 rounded-lg bg-white shadow-sm text-gray-800 transition">極簡白</button>
          <button type="button" onclick="setTheme('dark')" id="themeDarkBtn" class="text-xs font-bold px-2.5 py-1 rounded-lg text-gray-500 transition">質感深灰</button>
        </div>
      </div>

      <!-- 顯示最終合成的 Image -->
      <div class="rounded-xl overflow-hidden shadow-lg border border-gray-200 bg-gray-100 flex items-center justify-center">
        <img id="finalPolaroidImg" alt="合成拍立得" class="w-full h-auto block" />
      </div>

      <!-- 備用下載按鈕 -->
      <button type="button" onclick="downloadImage()" class="w-full bg-gray-900 hover:bg-black active:scale-[0.99] text-white font-bold py-3 rounded-xl text-sm flex items-center justify-center space-x-2 transition">
        <span>⬇️ 點擊下載高畫質原圖圖卡</span>
      </button>

      <!-- 隱藏的 Canvas 用於高解析度繪圖 -->
      <canvas id="polaroidCanvas" class="hidden"></canvas>
    </section>

  </main>

  <script>
    var foodImageObj = null;
    var foodBase64 = null;
    var foodMimeType = "image/jpeg";
    var menuBase64 = null;
    var menuMimeType = "image/jpeg";
    var currentTheme = 'light';

    window.addEventListener('DOMContentLoaded', function() {
      try {
        var savedKey = localStorage.getItem('gemini_diet_api_key');
        var savedModel = localStorage.getItem('gemini_diet_model') || 'gemini-3.8-flash';
        document.getElementById('modelInput').value = savedModel;

        if (savedKey) {
          document.getElementById('apiKeyInput').value = savedKey;
          updateApiStatus(true);
        } else {
          document.getElementById('apiModal').classList.remove('hidden');
          updateApiStatus(false);
        }
      } catch (e) {
        console.error(e);
      }
    });

    function toggleApiModal() {
      var modal = document.getElementById('apiModal');
      if (modal.classList.contains('hidden')) {
        modal.classList.remove('hidden');
      } else {
        modal.classList.add('hidden');
      }
    }

    function setModelName(name) {
      document.getElementById('modelInput').value = name;
    }

    function saveApiKey() {
      var key = document.getElementById('apiKeyInput').value.trim();
      var model = document.getElementById('modelInput').value.trim() || 'gemini-3.8-flash';
      if (!key) {
        alert('請輸入有效的 Gemini API Key');
        return;
      }
      localStorage.setItem('gemini_diet_api_key', key);
      localStorage.setItem('gemini_diet_model', model);
      updateApiStatus(true);
      document.getElementById('apiModal').classList.add('hidden');
    }

    function updateApiStatus(hasKey) {
      var dot = document.getElementById('apiDot');
      if (hasKey) {
        dot.classList.remove('bg-gray-400', 'bg-red-500');
        dot.classList.add('bg-emerald-500');
      } else {
        dot.classList.remove('bg-emerald-500');
        dot.classList.add('bg-red-500');
      }
    }

    function handleImageUpload(event, type) {
      var file = event.target.files[0];
      if (!file) return;

      var reader = new FileReader();
      reader.onload = function(e) {
        var dataUrl = e.target.result;
        var img = new Image();
        img.onload = function() {
          var tempCanvas = document.createElement('canvas');
          var w = img.naturalWidth;
          var h = img.naturalHeight;
          var maxApiDim = 1024;
          if (w > maxApiDim || h > maxApiDim) {
            var r = Math.min(maxApiDim / w, maxApiDim / h);
            w = Math.round(w * r);
            h = Math.round(h * r);
          }
          tempCanvas.width = w;
          tempCanvas.height = h;
          tempCanvas.getContext('2d').drawImage(img, 0, 0, w, h);
          var compressedDataUrl = tempCanvas.toDataURL('image/jpeg', 0.85);

          if (type === 'food') {
            foodMimeType = "image/jpeg";
            foodBase64 = compressedDataUrl.split(',')[1];
            foodImageObj = img;

            var preview = document.getElementById('foodPreview');
            preview.src = dataUrl;
            preview.classList.remove('hidden');
            document.getElementById('foodPlaceholder').classList.add('hidden');

            if (!document.getElementById('polaroidSection').classList.contains('hidden')) {
              renderPolaroid();
            }
          } else if (type === 'menu') {
            menuMimeType = "image/jpeg";
            menuBase64 = compressedDataUrl.split(',')[1];
            var previewMenu = document.getElementById('menuPreview');
            previewMenu.src = dataUrl;
            previewMenu.classList.remove('hidden');
            document.getElementById('menuPlaceholder').classList.add('hidden');
          }
        };
        img.src = dataUrl;
      };
      reader.readAsDataURL(file);
    }

    function showManualSection() {
      if (!foodImageObj) {
        alert('請先上傳一張「餐點實拍照」作為拍立得底圖喔！');
        return;
      }
      document.getElementById('resultSection').classList.remove('hidden');
      document.getElementById('polaroidSection').classList.remove('hidden');
      renderPolaroid();
      document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });
    }

    async function callGeminiWithFallback(apiKey, payload) {
      var preferredModel = localStorage.getItem('gemini_diet_model') || 'gemini-3.8-flash';
      var candidates = [preferredModel, 'gemini-3.8-flash', 'gemini-flash-latest', 'gemini-3.0-flash'];
      var uniqueModels = [];
      for (var i = 0; i < candidates.length; i++) {
        if (uniqueModels.indexOf(candidates[i]) === -1) {
          uniqueModels.push(candidates[i]);
        }
      }

      var lastError = null;
      for (var j = 0; j < uniqueModels.length; j++) {
        var modelName = uniqueModels[j];
        try {
          var response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + modelName + ':generateContent?key=' + apiKey, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          var data = await response.json();
          if (response.ok) {
            localStorage.setItem('gemini_diet_model', modelName);
            document.getElementById('modelInput').value = modelName;
            return data;
          }
          lastError = (data.error && data.error.message) ? data.error.message : ('模型 ' + modelName + ' 請求失敗');
          if (lastError.indexOf('API_KEY_INVALID') !== -1 || lastError.indexOf('API key not valid') !== -1) {
            throw new Error('API Key 無效，請確認是否複製完整');
          }
        } catch (err) {
          lastError = err.message;
        }
      }
      throw new Error(lastError);
    }

    async function analyzeWithAI() {
      var apiKey = localStorage.getItem('gemini_diet_api_key');
      if (!apiKey) {
        alert('請先點擊右上角「API 設定」貼上您的免費 Gemini API Key！');
        document.getElementById('apiModal').classList.remove('hidden');
        return;
      }
      if (!foodImageObj || !foodBase64) {
        alert('請先上傳「餐點實拍照」喔！');
        return;
      }

      var note = document.getElementById('noteInput').value.trim();
      var btn = document.getElementById('analyzeBtn');
      var btnText = document.getElementById('btnText');
      var btnLoader = document.getElementById('btnLoader');

      btn.disabled = true;
      btnText.textContent = 'AI 正在精算營養與合成拍立得...';
      btnLoader.classList.remove('hidden');

      try {
        var menuHint = menuBase64 ? '、「菜單/標示照」（第二張圖）' : '';
        var noteHint = note ? note : '無特別補充';
        var promptText = '你是一位專業精準的台灣營養師。請根據提供的「餐點實拍照」（第一張圖）' + menuHint + '，以及使用者的補充說明：「' + noteHint + '」，精確估算這份餐點實際攝取的營養素。\n請嚴格只回傳 JSON 格式（不要包含 markdown 語法），包含以下欄位：\n{\n  "meal_title": "簡短有質感的餐點名稱（建議 10 字以內，顯示於拍立得底欄）",\n  "calories": 整數(大卡 kcal),\n  "protein": 數字(蛋白質克數 g，可至小數點第一位),\n  "carbs": 數字(碳水化合物克數 g，可至小數點第一位),\n  "fat": 數字(脂肪克數 g，可至小數點第一位),\n  "summary": "100字以內的繁體中文餐點內容拆解與營養總結（例如各食材份量估算與營養比例點評）"\n}';

        var parts = [{ text: promptText }];
        parts.push({ inline_data: { mime_type: foodMimeType, data: foodBase64 } });
        if (menuBase64) {
          parts.push({ inline_data: { mime_type: menuMimeType, data: menuBase64 } });
        }

        var payload = {
          contents: [{ parts: parts }],
          generationConfig: {
            responseMimeType: "application/json"
          }
        };

        var data = await callGeminiWithFallback(apiKey, payload);
        var rawText = data.candidates[0].content.parts[0].text.trim();
        rawText = rawText.replace(/^```json\s*/i, '').replace(/```$/, '').trim();
        var result = JSON.parse(rawText);

        document.getElementById('titleInput').value = result.meal_title || '營養餐點紀錄';
        document.getElementById('calInput').value = Math.round(result.calories || 0);
        document.getElementById('proInput').value = Number(result.protein || 0).toFixed(1).replace(/\.0$/, '');
        document.getElementById('carbInput').value = Number(result.carbs || 0).toFixed(1).replace(/\.0$/, '');
        document.getElementById('fatInput').value = Number(result.fat || 0).toFixed(1).replace(/\.0$/, '');
        document.getElementById('summaryInput').value = result.summary || '';

        document.getElementById('resultSection').classList.remove('hidden');
        document.getElementById('polaroidSection').classList.remove('hidden');
        renderPolaroid();
        document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });

      } catch (err) {
        alert('分析發生錯誤：' + err.message);
      } finally {
        btn.disabled = false;
        btnText.textContent = '✨ AI 智能估算並生成拍立得';
        btnLoader.classList.add('hidden');
      }
    }

    function setTheme(theme) {
      currentTheme = theme;
      var lightBtn = document.getElementById('themeLightBtn');
      var darkBtn = document.getElementById('themeDarkBtn');
      if (theme === 'light') {
        lightBtn.className = "text-xs font-bold px-2.5 py-1 rounded-lg bg-white shadow-sm text-gray-800 transition";
        darkBtn.className = "text-xs font-bold px-2.5 py-1 rounded-lg text-gray-500 transition";
      } else {
        darkBtn.className = "text-xs font-bold px-2.5 py-1 rounded-lg bg-gray-800 shadow-sm text-white transition";
        lightBtn.className = "text-xs font-bold px-2.5 py-1 rounded-lg text-gray-500 transition";
      }
      renderPolaroid();
    }

    function renderPolaroid() {
      if (!foodImageObj) return;

      var canvas = document.getElementById('polaroidCanvas');
      var ctx = canvas.getContext('2d');

      var maxDim = 1800;
      var imgW = foodImageObj.naturalWidth;
      var imgH = foodImageObj.naturalHeight;
      if (imgW > maxDim || imgH > maxDim) {
        var ratio = Math.min(maxDim / imgW, maxDim / imgH);
        imgW = Math.round(imgW * ratio);
        imgH = Math.round(imgH * ratio);
      }

      var pad = Math.round(imgW * 0.045);
      var footerH = Math.round(imgW * 0.22);
      var totalW = imgW + pad * 2;
      var totalH = imgH + pad + footerH;

      canvas.width = totalW;
      canvas.height = totalH;

      var isDark = currentTheme === 'dark';
      var bgColor = isDark ? '#18181B' : '#FFFFFF';
      var titleColor = isDark ? '#FAFAFA' : '#111827';
      var dateColor = isDark ? '#A1A1AA' : '#6B7280';
      var dividerColor = isDark ? '#27272A' : '#E5E7EB';
      var calColor = isDark ? '#FB923C' : '#EA580C';
      var proColor = isDark ? '#34D399' : '#059669';
      var labelColor = isDark ? '#A1A1AA' : '#6B7280';

      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, totalW, totalH);

      ctx.drawImage(foodImageObj, pad, pad, imgW, imgH);

      var title = document.getElementById('titleInput').value || '飲食紀錄';
      var cal = document.getElementById('calInput').value || '0';
      var pro = document.getElementById('proInput').value || '0';

      var now = new Date();
      var yyyy = now.getFullYear();
      var mm = String(now.getMonth() + 1).padStart(2, '0');
      var dd = String(now.getDate()).padStart(2, '0');
      var hh = String(now.getHours()).padStart(2, '0');
      var min = String(now.getMinutes()).padStart(2, '0');
      var dateStr = yyyy + '.' + mm + '.' + dd + ' ' + hh + ':' + min;

      var footerTop = pad + imgH;
      var centerY = footerTop + footerH / 2;

      var titleFontSize = Math.round(imgW * 0.042);
      var dateFontSize = Math.round(imgW * 0.026);
      var numFontSize = Math.round(imgW * 0.062);
      var unitFontSize = Math.round(imgW * 0.024);

      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';

      ctx.font = '800 ' + titleFontSize + 'px "Noto Sans TC", "Inter", sans-serif';
      ctx.fillStyle = titleColor;
      var maxTitleWidth = imgW * 0.46;
      var displayTitle = title;
      while (ctx.measureText(displayTitle).width > maxTitleWidth && displayTitle.length > 1) {
        displayTitle = displayTitle.slice(0, -1);
      }
      if (displayTitle !== title) displayTitle += '…';
      ctx.fillText(displayTitle, pad, centerY - footerH * 0.04);

      ctx.font = '500 ' + dateFontSize + 'px "Inter", sans-serif';
      ctx.fillStyle = dateColor;
      ctx.fillText(dateStr, pad, centerY + footerH * 0.22);

      var rightEdge = totalW - pad;

      ctx.textAlign = 'right';
      ctx.font = '700 ' + unitFontSize + 'px "Noto Sans TC", "Inter", sans-serif';
      ctx.fillStyle = labelColor;
      ctx.fillText('蛋白質 PROTEIN', rightEdge, centerY - footerH * 0.16);

      ctx.font = '800 ' + (unitFontSize * 1.1) + 'px "Inter", sans-serif';
      ctx.fillStyle = proColor;
      var proUnitWidth = ctx.measureText(' g').width;
      ctx.fillText(' g', rightEdge, centerY + footerH * 0.24);

      ctx.font = '800 ' + numFontSize + 'px "Inter", sans-serif';
      ctx.fillText(pro, rightEdge - proUnitWidth, centerY + footerH * 0.24);
      var proBlockWidth = Math.max(
        ctx.measureText(pro).width + proUnitWidth,
        unitFontSize * 7.5
      );

      var dividerX = rightEdge - proBlockWidth - (imgW * 0.04);
      ctx.strokeStyle = dividerColor;
      ctx.lineWidth = Math.max(2, Math.round(imgW * 0.0025));
      ctx.beginPath();
      ctx.moveTo(dividerX, centerY - footerH * 0.28);
      ctx.lineTo(dividerX, centerY + footerH * 0.28);
      ctx.stroke();

      var calRightEdge = dividerX - (imgW * 0.04);
      ctx.font = '700 ' + unitFontSize + 'px "Noto Sans TC", "Inter", sans-serif';
      ctx.fillStyle = labelColor;
      ctx.fillText('熱量 CALORIES', calRightEdge, centerY - footerH * 0.16);

      ctx.font = '800 ' + (unitFontSize * 1.1) + 'px "Inter", sans-serif';
      ctx.fillStyle = calColor;
      var calUnitWidth = ctx.measureText(' kcal').width;
      ctx.fillText(' kcal', calRightEdge, centerY + footerH * 0.24);

      ctx.font = '800 ' + numFontSize + 'px "Inter", sans-serif';
      ctx.fillText(cal, calRightEdge - calUnitWidth, centerY + footerH * 0.24);

      var finalImg = document.getElementById('finalPolaroidImg');
      finalImg.src = canvas.toDataURL('image/jpeg', 0.95);
    }

    function downloadImage() {
      var canvas = document.getElementById('polaroidCanvas');
      var link = document.createElement('a');
      var title = document.getElementById('titleInput').value || '飲食紀錄';
      var now = new Date();
      var dateTag = String(now.getFullYear()) + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0');
      link.download = dateTag + '-' + title + '.jpg';
      link.href = canvas.toDataURL('image/jpeg', 0.95);
      link.click();
    }

    function copySummaryText() {
      var title = document.getElementById('titleInput').value;
      var cal = document.getElementById('calInput').value;
      var pro = document.getElementById('proInput').value;
      var carb = document.getElementById('carbInput').value;
      var fat = document.getElementById('fatInput').value;
      var summary = document.getElementById('summaryInput').value;

      var text = '🍽️ 【' + title + '】\n🔥 熱量：' + cal + ' kcal ｜ 💪 蛋白質：' + pro + ' g\n🍚 碳水：' + carb + ' g ｜ 🥑 脂肪：' + fat + ' g\n📝 總結：' + summary;
      navigator.clipboard.writeText(text).then(function() {
        alert('已複製完整營養紀錄文字！');
      });
    }
  </script>
</body>
